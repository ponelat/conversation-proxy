openapi: 3.1.0
info:
  title: Conversation Proxy — Control/Data Plane
  version: 0.1.0
  description: >
    Synchronous REST API for the conversation proxy service. Covers sending turns,
    managing conversations, previewing assembled context (without calling the LLM),
    and querying call-record telemetry. The streaming debug channel is specified
    separately in asyncapi.yaml.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: http://localhost:8787
security:
  - apiKey: []
paths:
  /conversations:
    post:
      operationId: createConversation
      summary: Create a conversation under a scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { $ref: "#/components/schemas/ConversationScope" }
                meta:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationMeta" }
    get:
      operationId: listConversations
      summary: List conversations by scope
      parameters:
        - in: query
          name: scope
          required: true
          description: >
            Hierarchy elements joined by '/' and each percent-encoded
            (e.g. user_42%2Fclient_88%2Fpatient_3).
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConversationMeta" }
  /conversations/{id}:
    get:
      operationId: getConversation
      summary: Fetch a conversation with its messages
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { description: Not found }
  /agents:
    get:
      operationId: listAgents
      summary: List loaded agents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, persists]
                  properties:
                    name: { type: string }
                    persists: { type: boolean }
  /agents/{agent}/messages:
    post:
      operationId: send
      summary: Send a turn to a named agent and get the reply (the facade send())
      description: >
        `{agent}` is the agent's filename identity (e.g. "transcribe", "summarize",
        or "default"). Unknown agent → 404. Persisting agents return a
        conversationId; utility (persist:false) agents do not.
      parameters:
        - { in: path, name: agent, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, input]
              properties:
                scope: { $ref: "#/components/schemas/ConversationScope" }
                conversationId: { type: string }
                input:
                  type: array
                  items: { $ref: "#/components/schemas/ContentPart" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentResponse" }
        "404": { description: Unknown agent }
  /agents/{agent}/context:
    get:
      operationId: previewContext
      summary: Show what context the agent WOULD assemble, without calling the LLM
      parameters:
        - { in: path, name: agent, required: true, schema: { type: string } }
        - in: query
          name: scope
          required: true
          schema: { type: string }
        - { in: query, name: conversationId, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssembledContext" }
  /blobs:
    post:
      operationId: uploadBlob
      summary: Upload media (write-behind mint); returns a sourceUri to embed in a ContentPart
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Minted (upload may still be flushing)
          content:
            application/json:
              schema:
                type: object
                required: [uuid, sourceUri]
                properties:
                  uuid: { type: string }
                  sourceUri: { type: string }
  /blobs/{uuid}:
    get:
      operationId: getBlob
      summary: Fetch/stream a blob (debug download/play links resolve here)
      parameters:
        - { in: path, name: uuid, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Not found }
  /conversations/{id}/context_legacy:
    get:
      operationId: previewContextLegacy
      summary: (deprecated) use /agents/{agent}/context
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssembledContext" }
  /extra-context:
    get:
      operationId: getExtraContext
      summary: Read scope-attached JSON (D14)
      parameters:
        - in: query
          name: scope
          required: true
          description: Hierarchy elements joined by '/' and percent-encoded.
          schema: { type: string }
      responses:
        "200":
          description: OK (value, or null if unset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonValue" }
    put:
      operationId: setExtraContext
      summary: Write scope-attached JSON (D14)
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { $ref: "#/components/schemas/JsonValue" }
      responses:
        "204": { description: Stored }
    delete:
      operationId: clearExtraContext
      summary: Clear scope-attached JSON (D14)
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string }
      responses:
        "204": { description: Cleared }
  /records/{traceId}:
    get:
      operationId: getRecord
      summary: Fetch a full call-record envelope
      parameters:
        - { in: path, name: traceId, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallRecord" }
        "404": { description: Not found }
  /records:
    get:
      operationId: queryRecords
      summary: Query call-record metadata
      parameters:
        - in: query
          name: agent
          required: false
          schema: { type: string }
        - in: query
          name: scopePrefix
          required: false
          description: Hierarchy prefix, '/'-joined and percent-encoded; matches records whose scope starts with it.
          schema: { type: string }
        - { in: query, name: conversationId, schema: { type: string } }
        - { in: query, name: model, schema: { type: string } }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: until, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CallRecordMeta" }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    ConversationScope:
      type: array
      description: >
        Ordered hierarchy of opaque string IDs, broadest level first and the leaf
        last (e.g. ["user_42","client_88","patient_3","2026-W26"]). The server
        attaches no meaning to any level.
      items: { type: string }
      minItems: 1
    JsonValue:
      description: Arbitrary JSON value stored in the extra-context store.
      nullable: true
    ConversationMeta:
      type: object
      required: [id, scope, createdAt, updatedAt]
      properties:
        id: { type: string }
        scope: { $ref: "#/components/schemas/ConversationScope" }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    ContentPart:
      description: Normalized content part (D16). Non-text parts are blob-only via sourceUri.
      oneOf:
        - type: object
          required: [kind, text]
          properties:
            kind: { type: string, enum: [text] }
            text: { type: string }
        - type: object
          required: [kind, mime, sourceUri]
          properties:
            kind: { type: string, enum: [image, audio, file] }
            mime: { type: string }
            sourceUri: { type: string }
            transcript: { type: string }
            name: { type: string }
    PartMeta:
      type: object
      description: Ephemeral per-request transport metadata (D16) — never persisted.
      properties:
        resolve: { type: boolean, description: "true → hydrate to bytes for the provider" }
    AssembledPart:
      type: object
      required: [part]
      properties:
        part: { $ref: "#/components/schemas/ContentPart" }
        meta: { $ref: "#/components/schemas/PartMeta" }
    AssembledMessage:
      type: object
      required: [source, parts]
      properties:
        source: { $ref: "#/components/schemas/StoredMessage" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/AssembledPart" }
        meta: { type: object, additionalProperties: true }
    StoredMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          type: array
          items: { $ref: "#/components/schemas/ContentPart" }
        tokenCount: { type: integer }
        createdAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    Conversation:
      allOf:
        - $ref: "#/components/schemas/ConversationMeta"
        - type: object
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/StoredMessage" }
    ContextSegment:
      type: object
      required: [source, stability, messages]
      properties:
        source: { type: string }
        stability: { type: string, enum: [static, semi-static, volatile] }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AssembledMessage" }
    AssembledContext:
      type: object
      required: [segments, totalTokens]
      properties:
        segments:
          type: array
          items: { $ref: "#/components/schemas/ContextSegment" }
        totalTokens: { type: integer }
    Usage:
      type: object
      required: [promptTokens, completionTokens, cachedTokens]
      properties:
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        cachedTokens: { type: integer }
    AgentResponse:
      type: object
      required: [reply, traceId, usage]
      properties:
        reply: { type: string }
        conversationId: { type: string, description: "present only for persisting agents" }
        traceId: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
    CallRecordMeta:
      type: object
      required: [traceId, agent, model, usage, latencyMs, timestamp]
      properties:
        traceId: { type: string }
        agent: { type: string }
        conversationId: { type: string }
        scope: { $ref: "#/components/schemas/ConversationScope" }
        model: { type: string }
        usage: { $ref: "#/components/schemas/Usage" }
        latencyMs: { type: integer }
        timestamp: { type: string, format: date-time }
        replyPreview: { type: string }
    CallRecord:
      allOf:
        - $ref: "#/components/schemas/CallRecordMeta"
        - type: object
          properties:
            systemPrompt: { type: string }
            requestMessages:
              type: array
              items: { $ref: "#/components/schemas/AssembledMessage" }
            error:
              type: object
              properties:
                stage: { type: string, enum: [assemble, cache, llm, persist] }
                message: { type: string }
