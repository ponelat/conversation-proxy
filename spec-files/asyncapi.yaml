asyncapi: 3.0.0
info:
  title: Conversation Proxy — Debug Plane
  version: 0.1.0
  description: >
    Event-driven specification for the real-time debug channel. A client (the
    observation UI) subscribes over Server-Sent Events and receives the lifecycle
    events of each LLM call as it flows through assemble -> cache -> llm -> persist.
    The synchronous control/data plane is specified separately in openapi.yaml.
servers:
  debug:
    host: "localhost:8787"
    pathname: /debug
    protocol: sse
    description: Server-Sent Events stream of debug lifecycle events.
channels:
  debugStream:
    address: /debug/stream
    description: >
      SSE stream of DebugEvents. Optional query filters: traceId (single trace)
      and types (comma-separated DebugEvent.type values). Each connection registers
      a subscriber; closing the connection unsubscribes.
    parameters:
      traceId:
        description: Restrict the stream to a single trace.
      types:
        description: Comma-separated list of event types to include.
    messages:
      requestReceived: { $ref: "#/components/messages/RequestReceived" }
      contextAssembled: { $ref: "#/components/messages/ContextAssembled" }
      cachePrepared: { $ref: "#/components/messages/CachePrepared" }
      llmRequest: { $ref: "#/components/messages/LlmRequest" }
      llmChunk: { $ref: "#/components/messages/LlmChunk" }
      llmResponse: { $ref: "#/components/messages/LlmResponse" }
      errorEvent: { $ref: "#/components/messages/ErrorEvent" }
operations:
  receiveDebugEvents:
    action: receive
    channel: { $ref: "#/channels/debugStream" }
    summary: Subscribe to the live debug event stream.
    messages:
      - { $ref: "#/channels/debugStream/messages/requestReceived" }
      - { $ref: "#/channels/debugStream/messages/contextAssembled" }
      - { $ref: "#/channels/debugStream/messages/cachePrepared" }
      - { $ref: "#/channels/debugStream/messages/llmRequest" }
      - { $ref: "#/channels/debugStream/messages/llmChunk" }
      - { $ref: "#/channels/debugStream/messages/llmResponse" }
      - { $ref: "#/channels/debugStream/messages/errorEvent" }
components:
  messages:
    RequestReceived:
      name: request.received
      payload:
        type: object
        required: [type, traceId, agent, conversationId, scope, ts]
        properties:
          type: { const: request.received }
          traceId: { type: string }
          agent: { type: string }
          conversationId: { type: string }
          scope: { $ref: "#/components/schemas/ConversationScope" }
          ts: { type: string, format: date-time }
    ContextAssembled:
      name: context.assembled
      payload:
        type: object
        required: [type, traceId, agent, segments, totalTokens, ts]
        properties:
          type: { const: context.assembled }
          traceId: { type: string }
          agent: { type: string }
          segments:
            type: array
            items: { $ref: "#/components/schemas/ContextSegment" }
          totalTokens: { type: integer }
          ts: { type: string, format: date-time }
    CachePrepared:
      name: cache.prepared
      payload:
        type: object
        required: [type, traceId, agent, breakpoints, prefixTokens, ts]
        properties:
          type: { const: cache.prepared }
          traceId: { type: string }
          agent: { type: string }
          breakpoints:
            type: array
            items: { $ref: "#/components/schemas/CacheBreakpoint" }
          prefixTokens: { type: integer }
          ts: { type: string, format: date-time }
    LlmRequest:
      name: llm.request
      payload:
        type: object
        required: [type, traceId, agent, model, messages, systemPrompt, ts]
        properties:
          type: { const: llm.request }
          traceId: { type: string }
          agent: { type: string }
          model: { type: string }
          messages:
            type: array
            items: { $ref: "#/components/schemas/AssembledMessage" }
          systemPrompt: { type: string }
          ts: { type: string, format: date-time }
    LlmChunk:
      name: llm.chunk
      description: Emitted only when the LLM response is streamed.
      payload:
        type: object
        required: [type, traceId, agent, delta, ts]
        properties:
          type: { const: llm.chunk }
          traceId: { type: string }
          agent: { type: string }
          delta: { type: string }
          ts: { type: string, format: date-time }
    LlmResponse:
      name: llm.response
      payload:
        type: object
        required: [type, traceId, agent, reply, usage, latencyMs, ts]
        properties:
          type: { const: llm.response }
          traceId: { type: string }
          agent: { type: string }
          reply: { type: string }
          usage: { $ref: "#/components/schemas/Usage" }
          latencyMs: { type: integer }
          ts: { type: string, format: date-time }
    ErrorEvent:
      name: error
      payload:
        type: object
        required: [type, traceId, agent, stage, message, ts]
        properties:
          type: { const: error }
          traceId: { type: string }
          agent: { type: string }
          stage: { type: string, enum: [assemble, cache, llm, persist] }
          message: { type: string }
          ts: { type: string, format: date-time }
  schemas:
    ConversationScope:
      type: array
      description: Ordered hierarchy of opaque string IDs, broadest first, leaf last.
      items: { type: string }
      minItems: 1
    ContentPart:
      description: Normalized content part (D16); non-text parts are blob-only via sourceUri.
      oneOf:
        - type: object
          required: [kind, text]
          properties:
            kind: { type: string, enum: [text] }
            text: { type: string }
        - type: object
          required: [kind, mime, sourceUri]
          properties:
            kind: { type: string, enum: [image, audio, file] }
            mime: { type: string }
            sourceUri: { type: string }
            transcript: { type: string }
            name: { type: string }
    StoredMessage:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          type: array
          items: { $ref: "#/components/schemas/ContentPart" }
        tokenCount: { type: integer }
        createdAt: { type: string, format: date-time }
    AssembledPart:
      type: object
      required: [part]
      properties:
        part: { $ref: "#/components/schemas/ContentPart" }
        meta:
          type: object
          description: Ephemeral transport metadata; media carried as metadata only (never bytes).
          properties:
            resolve: { type: boolean }
    AssembledMessage:
      type: object
      required: [source, parts]
      properties:
        source: { $ref: "#/components/schemas/StoredMessage" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/AssembledPart" }
    ContextSegment:
      type: object
      required: [source, stability, messages]
      properties:
        source: { type: string }
        stability: { type: string, enum: [static, semi-static, volatile] }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AssembledMessage" }
    CacheBreakpoint:
      type: object
      required: [afterSegmentIndex]
      properties:
        afterSegmentIndex: { type: integer }
    Usage:
      type: object
      required: [promptTokens, completionTokens, cachedTokens]
      properties:
        promptTokens: { type: integer }
        completionTokens: { type: integer }
        cachedTokens: { type: integer }
